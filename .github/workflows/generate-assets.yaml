name: Generate Assets

on:
  push:
    branches:
      - Testing
  workflow_dispatch:

jobs:
  package-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build organized asset package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_DIR="sm64coopdx-assets"
          ZIP_FILE="sm64coopdx-android-assets.zip"

          rm -rf "$PACKAGE_DIR" "$ZIP_FILE"

          test -d actors
          test -d levels

          mkdir -p \
            "$PACKAGE_DIR/models" \
            "$PACKAGE_DIR/levels" \
            "$PACKAGE_DIR/textures" \
            "$PACKAGE_DIR/assets"

          cp -a actors/. "$PACKAGE_DIR/models/"
          cp -a levels/. "$PACKAGE_DIR/levels/"

          if [ -d textures ]; then
            cp -a textures/. "$PACKAGE_DIR/textures/"
          fi

          if [ -d assets ]; then
            cp -a assets/. "$PACKAGE_DIR/assets/"
          fi

          find "$PACKAGE_DIR" -type f \( \
            -name '*.bin' -o \
            -name '*.mio0' -o \
            -name '*.o' -o \
            -name '*.obj' -o \
            -name '*.elf' -o \
            -name '*.a' -o \
            -name '*.so' \
          \) -delete

          find "$PACKAGE_DIR" -type d -empty -delete

          {
            printf '%s\n' 'SM64CoopDX source asset package'
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Branch: %s\n' "$GITHUB_REF_NAME"
            printf '\nDirectory layout:\n'
            printf '%s\n' '  models/    Actor/model source folders and their files'
            printf '%s\n' '  levels/    Level source folders and their files'
            printf '%s\n' '  textures/  Repository-wide texture source files'
            printf '%s\n' '  assets/    Other source assets used by the project'
            printf '\nNo compiled binary files are included.\n'
          } > "$PACKAGE_DIR/MANIFEST.txt"

          echo "Packaged source files:"
          find "$PACKAGE_DIR" -type f -print | sort

          zip -qr "$ZIP_FILE" "$PACKAGE_DIR"

          echo
          echo "Created: $ZIP_FILE"
          ls -lh "$ZIP_FILE"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: sm64coopdx-android-assets
          path: sm64coopdx-android-assets.zip
          archive: false
          if-no-files-found: error
